text x="0" y="-37" fill="#122940" font-size="17" font-weight="700">05</text><text x="0" y="-10" fill="#122940" font-size="21" font-weight="700">Differentiate</text><text x="0" y="14" fill="#26435c" font-size="13">Respect differing needs</text><text x="0" y="43" fill="#41566b" font-size="11" letter-spacing="1">SCHNARCH</text></g><g transform="translate(987,400)"><rect x="-101" y="-63" width="202" height="126" rx="27" fill="#d3ebfa" stroke="#fffaf3" stroke-width="3"/><text x="0" y="-37" fill="#122940" font-size="17" font-weight="700">06</text><text x="0" y="-10" fill="#122940" font-size="21" font-weight="700">Discover</text><text x="0" y="14" fill="#26435c" font-size="13">Explore new possibilities</text><text x="0" y="43" fill="#41566b" font-size="11" letter-spacing="1">ARON</text></g><g transform="translate(886,570)"><rect x="-101" y="-63" width="202" height="126" rx="27" fill="#ffe4d2" stroke="#fffaf3" stroke-width="3"/><text x="0" y="-37" fill="#122940" font-size="17" font-weight="700">07</text><text x="0" y="-10" fill="#122940" font-size="21" font-weight="700">Apply</text><text x="0" y="14" fill="#26435c" font-size="13">Put learning into action</text><text x="0" y="43" fill="#41566b" font-size="11" letter-spacing="1">INTEGRATION</text></g><g transform="translate(666,637)"><rect x="-101" y="-63" width="202" height="126" rx="27" fill="#e0efd7" stroke="#fffaf3" stroke-width="3"/><text x="0" y="-37" fill="#122940" font-size="17" font-weight="700">08</text><text x="0" y="-10" fill="#122940" font-size="21" font-weight="700">Reflect</text><text x="0" y="14" fill="#26435c" font-size="13">Take learning into marriage</text><text x="0" y="43" fill="#41566b" font-size="11" letter-spacing="1">INTEGRATION</text></g>
