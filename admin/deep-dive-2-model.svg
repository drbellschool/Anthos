<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
<title id="title">Anthos Deep Dive 2.0: The Jack and Jill Method</title>
<desc id="desc">Eight learning milestones around one guided adventure: Recognize, Interpret, Navigate, Regulate, Differentiate, Discover, Apply, Reflect. Six story phases: Hook, Conflict, Discovery, Reattempt, Outcome, Reflection. Two private conversations create one shared consequence.</desc>
