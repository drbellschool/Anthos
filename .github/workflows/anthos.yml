name: Anthos checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Anthos public site, demo, API and admin
        run: node --test tests/*.test.mjs

  atlas-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Insight Atlas and 4.3 focused quality tests
        run: node --check admin/episode-studio.js && node --test tests/deep-dive-studio-43.test.mjs tests/jj41-sms-webhook-integration.test.mjs tests/jj43-sms-human-review.test.mjs tests/jj43-random-episode-transfer.test.mjs tests/anthos-story-quality.test.mjs tests/qa-jj43-relay.test.mjs tests/atlas-one-couple-review.test.mjs tests/atlas-live-qa-contract.test.mjs tests/jj43-authentic-voice.test.mjs tests/jj43-intent-attribution.test.mjs tests/atlas-diverse-couples-pilot.test.mjs tests/jj43-canonical-invariants.test.mjs tests/atlas-two-couples-pilot.test.mjs tests/atlas-incidental.test.mjs tests/atlas-auth-review.test.mjs tests/atlas-feedback-loop.test.mjs tests/atlas-opportunities.test.mjs tests/insight-atlas.test.mjs tests/jj43-developmental.test.mjs tests/episode-studio.test.mjs

  atlas-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Block 4.3 release until eight gates are proven
        run: node scripts/verify-atlas-release.mjs
